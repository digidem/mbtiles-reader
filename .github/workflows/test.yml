name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          echo "PLAYWRIGHT_VERSION=$(npx playwright --version)" >> $GITHUB_OUTPUT

      - name: Set Playwright cache path
        id: playwright-cache-path
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            echo "path=~/Library/Caches/ms-playwright" >> $GITHUB_OUTPUT
          else
            echo "path=~/.cache/ms-playwright" >> $GITHUB_OUTPUT
          fi

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.playwright-cache-path.outputs.path }}
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright webkit (macOS only)
        if: runner.os == 'macOS' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit

      - name: Run tests
        run: npx vitest run

      - name: Upload Playwright cache
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.playwright-cache-path.outputs.path }}
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  better-sqlite3-majors:
    # better-sqlite3 is declared as an optional dependency spanning two majors so
    # consumers are not forced onto one. Check that both actually work.
    strategy:
      fail-fast: false
      matrix:
        better-sqlite3: [12, 13]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install better-sqlite3 v${{ matrix.better-sqlite3 }}
        run: npm install --no-save better-sqlite3@${{ matrix.better-sqlite3 }}

      - name: Run Node tests
        run: npx vitest run --project node
